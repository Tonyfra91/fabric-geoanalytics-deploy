<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="380" viewBox="0 0 1040 380" role="img" aria-labelledby="title description" font-family="Segoe UI, Arial, sans-serif" font-size="18">
  <title id="title">Six-stage Fabric GeoAnalytics accelerator journey</title>
  <desc id="description">Read stages 1 through 3 across the top, then 4 through 6 across the bottom: prepare, deploy Azure, finish Fabric, store the key, run the model, and verify results. You control the Azure button, secret entry and approvals. Copilot runs the approved repeatable commands.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#334155"/>
    </marker>
  </defs>
  <g fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M 324 84 H 366"/>
    <path d="M 670 84 H 712"/>
    <path d="M 866 144 V 180 H 174 V 212"/>
    <path d="M 324 276 H 366"/>
    <path d="M 670 276 H 712"/>
  </g>
  <g fill="#0f172a">
    <g>
      <rect x="24" y="24" width="300" height="120" rx="14" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="42" y="58" font-size="22" font-weight="600">1. Prepare</text>
      <text x="42" y="90" font-size="17">You + Copilot: tools and access</text>
      <text x="42" y="120" font-size="16">FP01-08 / manual 01-12</text>
    </g>
    <g>
      <rect x="370" y="24" width="300" height="120" rx="14" fill="#fff7ed" stroke="#fdba74"/>
      <text x="388" y="58" font-size="22" font-weight="600">2. Deploy Azure</text>
      <text x="388" y="90" font-size="17">You: press button, review, Create</text>
      <text x="388" y="120" font-size="16">FP09 / manual 13-14</text>
    </g>
    <g>
      <rect x="716" y="24" width="300" height="120" rx="14" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="734" y="58" font-size="22" font-weight="600">3. Finish Fabric</text>
      <text x="734" y="90" font-size="17">Copilot: after your approval</text>
      <text x="734" y="120" font-size="16">FP10-11 / manual 15-19</text>
    </g>
    <g>
      <rect x="24" y="216" width="300" height="120" rx="14" fill="#fff7ed" stroke="#fdba74"/>
      <text x="42" y="250" font-size="22" font-weight="600">4. Store key</text>
      <text x="42" y="282" font-size="17">You: hidden terminal prompt</text>
      <text x="42" y="312" font-size="16">FP12 / manual 20</text>
    </g>
    <g>
      <rect x="370" y="216" width="300" height="120" rx="14" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="388" y="250" font-size="22" font-weight="600">5. Run model</text>
      <text x="388" y="282" font-size="17">Copilot: after your approval</text>
      <text x="388" y="312" font-size="16">FP13 / manual 21-22</text>
    </g>
    <g>
      <rect x="716" y="216" width="300" height="120" rx="14" fill="#f0fdf4" stroke="#86efac"/>
      <text x="734" y="250" font-size="22" font-weight="600">6. Verify results</text>
      <text x="734" y="282" font-size="17">You + Copilot: tables and SQL</text>
      <text x="734" y="312" font-size="16">FP14, FP16 / manual 23-24</text>
    </g>
  </g>
  <text x="24" y="367" fill="#334155" font-size="16">Optional real-source test: verify first, then repeat Run + Verify (FP15 / manual 25).</text>
</svg>
