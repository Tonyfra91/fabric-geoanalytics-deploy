<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="380" viewBox="0 0 1040 380" role="img" aria-labelledby="title description" font-family="Segoe UI, Arial, sans-serif" font-size="18">
  <title id="title">Five numbered folders for the Fabric GeoAnalytics journey</title>
  <desc id="description">Read 01 through 03 across the top, then 04 through 05 across the bottom. Start here, deploy Azure, finish Fabric, run and verify, then consider optional next steps. The numbers match the repository folders. You control Azure Create, secret entry and compute approvals.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#334155"/>
    </marker>
  </defs>
  <g fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M 324 84 H 366"/>
    <path d="M 670 84 H 712"/>
    <path d="M 866 144 V 180 H 347 V 212"/>
    <path d="M 497 276 H 539"/>
  </g>
  <g fill="#0f172a">
    <g>
      <rect x="24" y="24" width="300" height="120" rx="14" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="42" y="58" font-size="22" font-weight="600">01. Start here</text>
      <text x="42" y="90" font-size="17">Tools, access and route choice</text>
      <text x="42" y="120" font-size="16">01-start-here</text>
    </g>
    <g>
      <rect x="370" y="24" width="300" height="120" rx="14" fill="#fff7ed" stroke="#fdba74"/>
      <text x="388" y="58" font-size="22" font-weight="600">02. Deploy Azure</text>
      <text x="388" y="90" font-size="17">You: review parameters and Create</text>
      <text x="388" y="120" font-size="16">02-deploy-azure</text>
    </g>
    <g>
      <rect x="716" y="24" width="300" height="120" rx="14" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="734" y="58" font-size="22" font-weight="600">03. Finish Fabric</text>
      <text x="734" y="90" font-size="17">Approve setup; enter key yourself</text>
      <text x="734" y="120" font-size="16">03-finish-fabric</text>
    </g>
    <g>
      <rect x="197" y="216" width="300" height="120" rx="14" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="215" y="250" font-size="22" font-weight="600">04. Run and verify</text>
      <text x="215" y="282" font-size="17">Approve runs; inspect tables/SQL</text>
      <text x="215" y="312" font-size="16">04-run-and-verify</text>
    </g>
    <g>
      <rect x="543" y="216" width="300" height="120" rx="14" fill="#f0fdf4" stroke="#86efac"/>
      <text x="561" y="250" font-size="22" font-weight="600">05. Next steps</text>
      <text x="561" y="282" font-size="17">Architecture and future experiments</text>
      <text x="561" y="312" font-size="16">05-next-steps</text>
    </g>
  </g>
  <text x="24" y="367" fill="#334155" font-size="16">Folders 01-04: deployment and verification. Folder 05: optional next experiments. Never skip approval checkpoints.</text>
</svg>
